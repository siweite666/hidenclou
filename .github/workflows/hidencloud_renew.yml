name: HidenCloud Auto Renew

on:
  schedule:
    # 每天北京时间早上 9 点运行 (UTC 1:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动运行

# 防止多个任务同时运行导致更新 Secret 冲突
concurrency:
  group: hidencloud-renew
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install curl_cffi beautifulsoup4 pynacl

      - name: DEBUG dump renew page
        env:
          HIDEN_COOKIE: ${{ secrets.HIDEN_COOKIE }}
        run: |
          cat > /tmp/dbg.py <<'PYEOF'
          import os, re, sys
          from curl_cffi import requests
          s = requests.Session(impersonate="chrome110")
          for item in os.environ["HIDEN_COOKIE"].split(';'):
              if '=' in item:
                  k, v = item.strip().split('=', 1)
                  s.cookies.set(k, v, domain="dash.hidencloud.com")
          r = s.get("https://dash.hidencloud.com/dashboard", timeout=25)
          print("DASH", r.status_code, len(r.text))
          ids = re.findall(r"/service/(\d+)/manage", r.text)
          print("SERVICE_IDS", sorted(set(ids)))
          if not ids:
              sys.exit(0)
          sid = sorted(set(ids))[0]
          m = s.get(f"https://dash.hidencloud.com/service/{sid}/manage", timeout=25)
          print("MANAGE", m.status_code, len(m.text))
          open("/tmp/manage.html", "w").write(m.text)
          PYEOF
          python /tmp/dbg.py
          echo "=== turnstile 痕迹 ==="
          grep -o -i 'cf-turnstile\|challenges.cloudflare[^"]*\|data-sitekey="[^"]*"\|turnstile[^"<]\{0,40\}' /tmp/manage.html 2>/dev/null | sort | uniq -c | sort -rn | head -20
          echo "=== form 标签 ==="
          grep -o -i '<form[^>]*>' /tmp/manage.html 2>/dev/null | head -8
          echo "=== 含 turnstile 的行 ==="
          grep -i -n 'turnstile' /tmp/manage.html 2>/dev/null | head -12 | cut -c1-260

      - name: Run Renew Script
        env:
          HIDEN_COOKIE: ${{ secrets.HIDEN_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python hidencloud_renew.py

