name: HidenCloud Auto Renew

on:
  schedule:
    # 每天北京时间早上 9 点运行 (UTC 1:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动运行

# 防止多个任务同时运行导致更新 Secret 冲突
concurrency:
  group: hidencloud-renew
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install curl_cffi beautifulsoup4 pynacl

      - name: DEBUG dump renew page
        env:
          HIDEN_COOKIE: ${{ secrets.HIDEN_COOKIE }}
        run: |
          cat > /tmp/dbg.py <<'PYEOF'
          import os, re
          from curl_cffi import requests
          s = requests.Session(impersonate="chrome110")
          for item in os.environ["HIDEN_COOKIE"].split(';'):
              if '=' in item:
                  k, v = item.strip().split('=', 1)
                  s.cookies.set(k, v, domain="dash.hidencloud.com")
          m = s.get("https://dash.hidencloud.com/service/221433/manage", timeout=25)
          t = m.text
          L = t.split("\n")
          print("MANAGE", m.status_code, len(t), "lines", len(L))
          # ① 找 turnstile widget 附近
          for i, line in enumerate(L):
              if "cf-turnstile" in line and "class=" in line:
                  lo, hi = max(0, i-45), min(len(L), i+12)
                  print("--- widget @L%d ---" % i)
                  print("\n".join(L[lo:hi]))
                  break
          # ② 所有 form action + 前后 8 行
          for i, line in enumerate(L):
              if re.search(r"<form\s", line, re.I):
                  print("--- form @L%d ---" % i)
                  print("\n".join(L[i:i+16]))
          # ③ renew 按钮 / 链接
          for i, line in enumerate(L):
              if re.search(r"renew", line, re.I):
                  print("--- renew @L%d ---" % i)
                  print(line.strip()[:300])
          PYEOF
          python /tmp/dbg.py
      - name: Run Renew Script
        env:
          HIDEN_COOKIE: ${{ secrets.HIDEN_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python hidencloud_renew.py

