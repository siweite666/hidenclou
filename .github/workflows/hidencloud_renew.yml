name: HidenCloud Auto Renew

on:
  schedule:
    # 每天北京时间早上 9 点运行 (UTC 1:00)
    - cron: '0 1 * * *'
  workflow_dispatch:

# 防止多个任务同时运行导致更新 Secret 冲突
concurrency:
  group: hidencloud-renew
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: write        # 保活提交需要写权限
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase beautifulsoup4 pynacl
          seleniumbase install chromedriver

      # WARP：把机房 IP 换成 WARP 出口 —— Turnstile 在机房 IP 下不发起挑战
      # 用 fscarmen/warp-on-actions，不需要自备节点链接
      - name: 🌐 设置 WARP 代理
        uses: fscarmen/warp-on-actions@v1.1
        with:
          stack: dual

      - name: Run Renew Script
        env:
          HIDEN_COOKIE: ${{ secrets.HIDEN_COOKIE }}
          TG_BOT: ${{ secrets.TG_CHAT_ID }},${{ secrets.TG_BOT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python hidencloud_renew.py

      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidencloud-debug-${{ github.run_number }}
          path: hidencloud_debug_*.png
          retention-days: 3
          if-no-files-found: ignore

      # 保活：仓库 60 天无活动时 GitHub 会自动暂停定时工作流。
      # 每次运行提交一次时间戳，保持仓库活跃（eooce/Auto-Renew-HidenCloud 同款做法）。
      - name: 🕒 保活提交（防定时工作流被暂停）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "⏱️ 保活 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              gh run delete $run_id || true
            fi
          done
