name: _dbg_ts
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: |
          pip install -q seleniumbase beautifulsoup4 pyvirtualdisplay
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: test turnstile
        env:
          HIDEN_COOKIE: ${{ secrets.HIDEN_COOKIE }}
        run: python ts_test.py
